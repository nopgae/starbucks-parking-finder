name: API Tests

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "data/**"
      - "skills/**"
      - "scraper/data/normalized/**"
      - ".github/workflows/api-test.yml"
  pull_request:
    paths:
      - "api/**"
      - "data/**"
      - "skills/**"
      - "scraper/data/normalized/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json

      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
      - run: npm test

      # data/ and the skill CSV are generated from the parser; fail if they weren't regenerated
      - run: |
          npx ts-node scripts/export-data.ts
          git status --porcelain -- ../data ../skills
          test -z "$(git status --porcelain -- ../data ../skills)"

      - name: Skill search smoke test
        run: |
          python3 ../skills/starbucks-parking/scripts/find.py --near 공덕 --limit 3 | grep "공덕" > /dev/null
          python3 ../skills/starbucks-parking/scripts/find.py --near 판교 --type free --min-hours 2 | grep "무료" > /dev/null
          python3 ../skills/starbucks-parking/scripts/find.py --name 강남세곡DT | grep "강남세곡DT" > /dev/null
